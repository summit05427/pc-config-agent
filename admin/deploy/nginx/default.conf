# 管理端静态站点：由 frontend Nginx 的 /admin/ location 代理进来。
# 代理会剥掉 /admin/ 前缀，因此这里按根路径提供文件；前端资源仍以 /admin/assets/... 输出。
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # 基础安全响应头；location 内一旦自定义 add_header，就不再继承这里的配置
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite 产物带内容 hash，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发布后立即拿到新的资源引用
    location = /index.html {
        expires -1;
    }

    # TanStack Router 使用 history 模式，刷新子路由时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
