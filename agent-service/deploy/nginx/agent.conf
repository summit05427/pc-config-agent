# Agent Web 统一入口（方案 A）
# 放置方式二选一：
#   1. 复制到 nginx 的 conf.d/ 目录（该目录默认被 http {} 块包含）
#   2. 在你的 nginx.conf 的 http {} 内写 include /path/to/agent.conf;
#
# 路由约定：
#   /            -> 前端（开发用 Vite 5173；生产改为静态目录）
#   /api/        -> Spring Boot 业务后端（8080），路径原样转发
#   /agent/...   -> Agent 服务（8000），剥掉 /agent 前缀后转发

upstream agent_web {
    server 127.0.0.1:5173;
}

upstream agent_api {
    server 127.0.0.1:8080;
}

upstream agent_service {
    server 127.0.0.1:8000;
}

# 开发阶段前端走 Vite，HMR 需要 WebSocket 升级头；生产静态托管时用不到
map $http_upgrade $agent_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 2m;

    # ---------- 1. 前端 ----------
    location / {
        proxy_pass http://agent_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agent_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 生产环境直接托管打包产物时，用下面这段替换上面的 location /
    # location / {
    #     root /var/www/agent/dist;
    #     try_files $uri $uri/ /index.html;   # 前端路由刷新不 404
    # }

    # ---------- 2. 业务后端 ----------
    # 注意 proxy_pass 末尾没有斜杠：/api/v1/xxx 原样转发到 Spring Boot
    location /api/ {
        proxy_pass http://agent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 3. Agent（含 SSE 流式） ----------
    # 指标端点只允许内网/本机（Prometheus 抓取），公网在网关层直接 403
    location = /agent/api/v1/metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        proxy_pass http://agent_service/api/v1/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        gzip off;
    }

    # proxy_pass 末尾有斜杠：/agent/api/v1/chat/stream -> /api/v1/chat/stream
    location /agent/ {
        proxy_pass http://agent_service/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与后端日志中间件对齐，便于跨服务排查
        proxy_set_header X-Request-ID $request_id;

        # ---- SSE 必须的四项 ----
        proxy_buffering off;      # 不攒包，模型吐一块就下发一块
        proxy_cache off;          # 禁止缓存流式响应
        proxy_read_timeout 3600s; # 长连接读超时，避免长回答被 502
        proxy_send_timeout 3600s;
        gzip off;                 # 压缩会引入缓冲，破坏逐字效果
    }
}
