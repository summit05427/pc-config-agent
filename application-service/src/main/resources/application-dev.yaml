# 云服务器联调环境：应用与 PostgreSQL 同机部署，数据库只监听 127.0.0.1，不暴露公网。
# 若在本地通过 SSH 隧道连云端数据库，务必用临时环境变量覆盖，不要写进仓库。
spring:
    datasource:
        url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/agent}
        username: ${DB_USERNAME:agent}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
            minimum-idle: ${DB_POOL_MIN_IDLE:2}
            connection-timeout: 3000
            validation-timeout: 2000

# 联调环境保留接口文档，前端可直接对照；生产环境见 application-prod.yaml
springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true
