spring:
    config:
        # 仅本地/联调生效：直接读取仓库根 .env（从 application-service/ 启动时的上级目录），
        # 省去每次启动手动注入 DB / JWT 变量。optional 前缀保证文件缺失时静默跳过，
        # 因此容器与 CI 不受影响；test / prod profile 不加载本文件，保持测试与生产配置隔离。
        import: optional:file:../.env[.properties]
    datasource:
        # 根 .env 用 POSTGRES_PORT 定义宿主机映射端口，默认值与 Compose 保持一致
        url: ${DB_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/agent}
        username: ${DB_USERNAME:${POSTGRES_USER:agent}}
        # 根 .env 里只有 POSTGRES_PASSWORD，容器内则由 Compose 注入 DB_PASSWORD
        password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
        hikari:
            maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
            minimum-idle: ${DB_POOL_MIN_IDLE:2}
            connection-timeout: 3000
            validation-timeout: 2000

app:
    cors:
        # 本地默认放开前端 Vite 开发服务器，其他环境必须显式配置
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
