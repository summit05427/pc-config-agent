# 自动化测试不依赖真实数据库：关闭 Flyway，并让连接池在启动阶段不建连，
# 避免 @SpringBootTest 因数据库缺失而失败。持久层测试用 Testcontainers 单独启动实例。
spring:
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_test}
        username: ${DB_USERNAME:agent}
        password: ${DB_PASSWORD:}
        hikari:
            initialization-fail-timeout: -1
    flyway:
        enabled: false

