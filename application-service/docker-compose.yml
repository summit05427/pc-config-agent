# 本地开发依赖：只启动 PostgreSQL，云服务器上的部署见 /opt/agent/deploy。
# 使用前：复制 .env.example 为 .env 并修改密码，然后执行 docker compose up -d。
services:
  postgres:
    image: postgres:18-alpine
    container_name: agent-pg-local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定本机回环，不对局域网与公网暴露
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 的 PGDATA 为 /var/lib/postgresql/18/docker，必须挂载父目录
      - agent_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agent_pg_data:
